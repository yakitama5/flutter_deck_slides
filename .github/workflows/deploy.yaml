name: Build production web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-web-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: jdx/mise-action@v2

      - name: Install dependencies
        run: flutter pub get

      - name: Build web (全スライド)
        run: dart run tool/build_web.dart

      - name: Prepare GitHub Pages 集約ディレクトリ
        run: dart run tool/prepare_pages.dart

      - uses: actions/upload-artifact@v4
        with:
          name: web-production
          path: dist
          if-no-files-found: error
          retention-days: 7
