name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - name: Install dependencies
        run: flutter pub get

      - name: Activate melos
        run: |
          flutter pub global activate melos
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Analyze
        run: dart run melos run analyze --no-select

      - name: Format check
        run: dart run melos run format --no-select

      - name: Test
        run: dart run melos run test --no-select

      - name: Build web (全スライド)
        env:
          FLUTTER_WEB_SOURCE_MAPS: 'true'
        run: dart run tool/build_web.dart

      - name: Upload example source map
        uses: actions/upload-artifact@v4
        with:
          name: example-source-map
          path: |
            slides/example/build/web/main.dart.js
            slides/example/build/web/main.dart.js.map
