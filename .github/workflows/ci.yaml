name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - name: Install dependencies
        run: flutter pub get

      - name: Activate melos
        run: |
          flutter pub global activate melos
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Prepare speaker notes (Git管理対象外ファイルをテンプレートから生成)
        run: |
          for example in slides/*/lib/speaker_notes.example.dart; do
            cp "$example" "$(dirname "$example")/speaker_notes.dart"
          done

      - name: Analyze
        run: dart run melos run analyze --no-select

      - name: Format check
        run: dart run melos run format --no-select

      - name: Test
        run: dart run melos run test --no-select

      - name: Build web (全スライド)
        run: dart run tool/build_web.dart
