name: flutter_deck_slides_workspace
publish_to: none

environment:
  sdk: ^3.13.1

workspace:
  - packages/flutter_deck_patched
  - packages/flutter_deck_storybook
  - slides/example
  - slides/202607_claudenotebooklm
  - slides/202608_risukun_super_tenkomori_car
  - slides/20260912_oso

dev_dependencies:
  melos: ^7.3.0

melos:
  scripts:
    dev:
      description: スライドを選択して Chrome で起動
      exec: flutter run -d chrome
      packageFilters:
        dependsOn: flutter_deck

    build:web:
      description: 全スライドを web ビルド(成果物は各パッケージの build/web)
      run: dart run tool/build_web.dart

    analyze:
      description: 全パッケージを dart analyze
      exec: dart analyze .

    format:
      description: 全パッケージを dart format でチェック
      exec: dart format --output=none --set-exit-if-changed .

    test:
      description: test ディレクトリを持つパッケージのみ flutter test
      exec: flutter test
      packageFilters:
        dirExists: test

    create:slide:
      description: "新規スライド雛形を作成 (例: melos run create:slide -- 202609_flutterkaigi)"
      run: dart run tool/create_slide.dart
