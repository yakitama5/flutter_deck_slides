name: oso_festival_20260912
description: "リスくんと もりのちいさなおまつり。FlutterKaigi mini 岡山の絵本LT。"
publish_to: none
resolution: workspace
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  flutter_deck: ^0.29.0
  flutter_deck_storybook: any
  flutter_deck_web_client: ^0.4.0
  url_launcher: ^6.3.2
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/story/
    - assets/event/banner.png
  fonts:
    - family: Kiwi Maru
      fonts:
        - asset: assets/fonts/KiwiMaru-Regular.ttf
          weight: 400
        - asset: assets/fonts/KiwiMaru-Medium.ttf
          weight: 500
