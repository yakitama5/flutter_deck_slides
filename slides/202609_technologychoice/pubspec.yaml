name: technologychoice_202609
description: "リスくんと ぴったりのかご。技術選定の理由を自分の言葉で残す10分の絵本LT。"
publish_to: 'none'
resolution: workspace

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  flutter_deck: ^0.29.0
  flutter_deck_storybook: any
  flutter_deck_web_client: ^0.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/story/
    - assets/evidence/
  fonts:
    - family: Kiwi Maru
      fonts:
        - asset: assets/fonts/KiwiMaru-Regular.ttf
          weight: 400
        - asset: assets/fonts/KiwiMaru-Medium.ttf
          weight: 500
